<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>Medicine Details - DawaStore</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .medicine-detail-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .medicine-header {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
        }

        .medicine-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        .medicine-info {
            flex: 1;
        }

        .medicine-name {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .medicine-price {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 20px;
        }

        .medicine-description {
            color: var(--text-color);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .medicine-details {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .detail-list {
            list-style: none;
            padding: 0;
        }

        .detail-list li {
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }

        .detail-list li:before {
            content: "•";
            color: var(--primary-color);
            position: absolute;
            left: 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--hover-color);
        }

        .btn-secondary {
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .library-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .library-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .medicine-header {
                flex-direction: column;
            }

            .medicine-image {
                width: 100%;
                height: auto;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" style="cursor: pointer;" onclick="window.location.href='dawastore.html'">
            <img src="images/logo.png" alt="DawaTrack Logo" class="logo-img">
            <span>DawaStore</span>
        </div>
        <div class="user-profile">
            <i class="fas fa-shopping-cart cart-icon" id="cartIcon">
                <span class="cart-count">0</span>
            </i>
            <i class="fas fa-circle-user"></i>
        </div>
    </header>

    <main>
        <div class="medicine-detail-container">
            <div class="medicine-header">
                <img src="" alt="" class="medicine-image" id="medicineImage">
                <div class="medicine-info">
                    <h1 class="medicine-name" id="medicineName"></h1>
                    <p class="medicine-price" id="medicinePrice"></p>
                    <p class="medicine-description" id="medicineDescription"></p>
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="addToCartBtn">
                            <i class="fas fa-shopping-cart"></i>
                            Add to Cart
                        </button>
                        <a href="medicine_library.html" class="btn btn-secondary" id="libraryLink">
                            <i class="fas fa-book-medical"></i>
                            View in Library
                        </a>
                    </div>
                </div>
            </div>

            <div class="medicine-details">
                <div class="detail-section">
                    <h3>Usage Instructions</h3>
                    <ul class="detail-list" id="usageInstructions">
                        <!-- Will be populated by JavaScript -->
                    </ul>
                </div>

                <div class="detail-section">
                    <h3>Side Effects</h3>
                    <ul class="detail-list" id="sideEffects">
                        <!-- Will be populated by JavaScript -->
                    </ul>
                </div>

                <div class="detail-section">
                    <h3>Precautions</h3>
                    <ul class="detail-list" id="precautions">
                        <!-- Will be populated by JavaScript -->
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Get medicine ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const medicineId = urlParams.get('id');

        // Sample medicine data (in a real application, this would come from a database)
        const medicines = [
            {
                id: 1,
                name: "Paracetamol 500mg",
                price: 45.00,
                description: "Fever and pain relief medicine. Take as directed by your doctor.",
                category: "tablets",
                image: "images/medicine-placeholder.jpg",
                inStock: true,
                usageInstructions: [
                    "Take with or without food",
                    "Do not exceed 4 tablets in 24 hours",
                    "Take every 4-6 hours as needed"
                ],
                sideEffects: [
                    "Nausea",
                    "Stomach upset",
                    "Liver problems (rare)",
                    "Allergic reactions"
                ],
                precautions: [
                    "Do not take with alcohol",
                    "Consult doctor if symptoms persist",
                    "Keep away from children",
                    "Store in a cool, dry place"
                ]
            },
            {
                id: 2,
                name: "Amoxicillin 250mg",
                price: 120.00,
                description: "Antibiotic medicine for bacterial infections.",
                category: "tablets",
                image: "images/medicine-placeholder.jpg",
                inStock: true,
                usageInstructions: [
                    "Take with food",
                    "Complete the full course",
                    "Take every 8 hours"
                ],
                sideEffects: [
                    "Diarrhea",
                    "Stomach upset",
                    "Rash",
                    "Yeast infection"
                ],
                precautions: [
                    "Take with food to prevent stomach upset",
                    "Do not skip doses",
                    "Inform doctor of any allergies",
                    "Store in a cool, dry place"
                ]
            },
            {
                id: 3,
                name: "Cough Syrup",
                price: 85.00,
                description: "Relief from cough and cold symptoms.",
                category: "syrups",
                image: "images/medicine-placeholder.jpg",
                inStock: true,
                usageInstructions: [
                    "Take as directed",
                    "Use measuring cup provided",
                    "Do not exceed recommended dose"
                ],
                sideEffects: [
                    "Drowsiness",
                    "Dizziness",
                    "Nausea",
                    "Dry mouth"
                ],
                precautions: [
                    "Do not drive after taking",
                    "Keep away from children",
                    "Do not take with alcohol",
                    "Store in a cool place"
                ]
            },
            {
                id: 4,
                name: "Dolo 650 Tablet",
                price: 35.00,
                description: "Pain reliever and fever reducer. Contains Paracetamol 650mg.",
                category: "tablets",
                image: "images/medicine-placeholder.jpg",
                inStock: true,
                usageInstructions: [
                    "Take with or without food",
                    "Do not exceed 3 tablets in 24 hours",
                    "Take every 6-8 hours as needed",
                    "For fever, take every 4-6 hours"
                ],
                sideEffects: [
                    "Nausea",
                    "Stomach upset",
                    "Liver problems (rare)",
                    "Allergic reactions"
                ],
                precautions: [
                    "Do not take with alcohol",
                    "Consult doctor if symptoms persist",
                    "Keep away from children",
                    "Store in a cool, dry place",
                    "Do not take with other paracetamol containing medicines"
                ]
            }
        ];

        // Find the medicine details
        const medicine = medicines.find(m => m.id === parseInt(medicineId));

        if (medicine) {
            // Update page content
            document.title = `${medicine.name} - DawaStore`;
            document.getElementById('medicineImage').src = medicine.image;
            document.getElementById('medicineImage').alt = medicine.name;
            document.getElementById('medicineName').textContent = medicine.name;
            document.getElementById('medicinePrice').textContent = `₹${medicine.price.toFixed(2)}`;
            document.getElementById('medicineDescription').textContent = medicine.description;

            // Populate usage instructions
            const usageList = document.getElementById('usageInstructions');
            medicine.usageInstructions.forEach(instruction => {
                const li = document.createElement('li');
                li.textContent = instruction;
                usageList.appendChild(li);
            });

            // Populate side effects
            const sideEffectsList = document.getElementById('sideEffects');
            medicine.sideEffects.forEach(effect => {
                const li = document.createElement('li');
                li.textContent = effect;
                sideEffectsList.appendChild(li);
            });

            // Populate precautions
            const precautionsList = document.getElementById('precautions');
            medicine.precautions.forEach(precaution => {
                const li = document.createElement('li');
                li.textContent = precaution;
                precautionsList.appendChild(li);
            });

            // Add to cart functionality
            document.getElementById('addToCartBtn').addEventListener('click', () => {
                // Here you would typically add the item to the cart
                // For now, we'll just show a notification
                alert('Added to cart!');
            });

            // Update library link to open the medicine library with the medicine name pre-filled
            const libraryLink = document.getElementById('libraryLink');
            libraryLink.href = `medicine_library.html?medicine=${encodeURIComponent(medicine.name)}`;
        } else {
            // Handle medicine not found
            document.querySelector('.medicine-detail-container').innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h2>Medicine not found</h2>
                    <p>The requested medicine could not be found.</p>
                    <a href="dawastore.html" class="btn btn-primary" style="display: inline-block; margin-top: 20px;">
                        Return to Store
                    </a>
                </div>
            `;
        }
    </script>
    
    <!-- Include the DawaDost widget script -->
    <script src="dawadost.js"></script>
</body>
</html>
