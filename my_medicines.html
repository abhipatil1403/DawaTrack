<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DawaTrack - My Medicines</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Initialize Supabase client using shared configuration
        const supabase = window.supabase.createClient(
            window.SUPABASE_CONFIG.url,
            window.SUPABASE_CONFIG.anonKey
        );

        // Wait for Supabase to be ready
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Test the connection
                const { data: { session } } = await supabase.auth.getSession();
                console.log('Supabase connected successfully');
            } catch (error) {
                console.error('Failed to connect to Supabase:', error);
                showNotification('Failed to connect to database. Please refresh the page.', 'error');
            }
        });

        // Helper function to show notifications
        // Notification queue system
        const notificationQueue = [];
        let isShowingNotification = false;

        function showNotification(message, type = 'info') {
            // Add to queue
            notificationQueue.push({ message, type });
            
            // If no notification is showing, start processing queue
            if (!isShowingNotification) {
                processNotificationQueue();
            }
        }

        function processNotificationQueue() {
            if (notificationQueue.length === 0) {
                isShowingNotification = false;
                return;
            }

            isShowingNotification = true;
            const { message, type } = notificationQueue.shift();

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(notification);

            // Trigger fade-in
            setTimeout(() => notification.classList.add('show'), 100);

            // Auto-remove after delay
            setTimeout(() => {
                notification.classList.add('fade-out');
                setTimeout(() => {
                    notification.remove();
                    // Process next notification in queue
                    processNotificationQueue();
                }, 300);
            }, 3000);
        }

        // Function to format date in 12-hour format (as specified in memories)
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true // Ensure 12-hour format as per memories
            });
        }

        // Function to format expiry date
        function formatExpiryDate(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            const daysUntilExpiry = Math.ceil((date - today) / (1000 * 60 * 60 * 24));
            
            let expiryClass = '';
            if (daysUntilExpiry <= 0) {
                expiryClass = 'expired';
            } else if (daysUntilExpiry <= 30) {
                expiryClass = 'expiring-soon';
            }

            return {
                formatted: date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                }),
                daysUntilExpiry,
                expiryClass
            };
        }

        // Global medicines array to store current medicines
        let medicines = [];

        // Function to get current user
        async function getCurrentUser() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error) {
                console.error('Error getting user:', error);
                return null;
            }
            return user;
        }

        // Function to load medicines from Supabase
        async function loadMedicines() {
            try {
                // Show loading spinner
                document.getElementById('loadingSpinner').style.display = 'flex';
                document.getElementById('medicinesGrid').style.display = 'none';
                document.getElementById('noMedicines').style.display = 'none';

                const user = await getCurrentUser();
                if (!user) {
                    showNotification('Please login to view medicines', 'error');
                    return;
                }

                const { data, error } = await supabase
                    .from('medicines')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('expiry_date', { ascending: true });

                if (error) throw error;

                medicines = data || [];
                renderMedicines(medicines);

            } catch (error) {
                console.error('Error loading medicines:', error);
                showNotification('Failed to load medicines. Please refresh the page.', 'error');
            } finally {
                // Hide loading spinner
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('medicinesGrid').style.display = 'grid';
            }
        }

        // Function to create expiry reminder
        async function createExpiryReminder(medicine, daysUntilExpiry) {
            try {
                const user = await getCurrentUser();
                if (!user) {
                    showNotification('Please login to create reminders', 'error');
                    return;
                }

                const expiryDate = new Date(medicine.expiry_date);
                const reminderDate = new Date(expiryDate);
                reminderDate.setDate(reminderDate.getDate() - 30); // Set reminder 30 days before expiry

                // Format time in 12-hour format as per memories
                const time = new Date().toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });

                const reminderData = {
                    title: `Medicine Expiry: ${medicine.name}`,
                    type: 'expiry',
                    date: reminderDate.toISOString().split('T')[0],
                    time: time,
                    notes: `"${medicine.name}" will expire on ${expiryDate.toLocaleDateString()}. Please check and replace if needed.`,
                    created_at: new Date().toISOString(),
                    status: 'pending',
                    priority: 'high',
                    user_id: user.id
                };

                const { data, error } = await supabase
                    .from('reminders')
                    .insert([reminderData])
                    .select();

                if (error) {
                    console.error('Supabase error:', error);
                    throw new Error(error.message);
                }

                if (!data || data.length === 0) {
                    throw new Error('No data returned after creating reminder');
                }

                showNotification(`Expiry reminder set for ${medicine.name}`, 'success');
            } catch (error) {
                console.error('Error creating expiry reminder:', error);
                showNotification(`Failed to create expiry reminder: ${error.message}`, 'error');
            }
        }

        // Function to create stock reminder
        async function createStockReminder(medicine) {
            try {
                const user = await getCurrentUser();
                if (!user) return;

                // Format time in 12-hour format as per memories
                const time = new Date().toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });

                const reminderData = {
                    title: `Reorder Medicine: ${medicine.name}`,
                    type: 'reorder', // Match calendar's reminder type
                    date: new Date().toISOString().split('T')[0], // Store date only
                    time: time,
                    notes: `Low stock alert for "${medicine.name}". Current stock: ${medicine.current_stock} units (Minimum required: ${medicine.minimum_stock} units).`,
                    created_at: new Date().toISOString(),
                    status: 'pending', // Match calendar's reminder status
                    priority: 'high' // High priority for expiry reminders
                };

                const { error: reminderError } = await supabase
                    .from('reminders')
                    .insert([reminderData]);

                if (reminderError) throw reminderError;

                showNotification(`Reorder reminder created for ${medicine.name}`, 'success');

                // Update reminder counts in the calendar if it exists
                if (window.updateReminderCounts) {
                    window.updateReminderCounts();
                }
            } catch (error) {
                console.error('Error creating reorder request:', error);
                showNotification('Failed to create reorder request: ' + error.message, 'error');
            }
        }

        // Google Calendar constants
        const GOOGLE_CLIENT_ID = '887243220092-3vj3tklll6meojqrcdcgdrc48568fnh5.apps.googleusercontent.com';
        const GOOGLE_API_KEY = 'AIzaSyBVlhaLcj5AkSnx9k3b6PUsAtPyOK1Gds0';
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        // Initialize Google API
        function initializeGoogleAPI() {
            return new Promise((resolve, reject) => {
                gapi.load('client', async () => {
                    try {
                        await gapi.client.init({
                            apiKey: GOOGLE_API_KEY,
                            discoveryDocs: [DISCOVERY_DOC]
                        });

                        // Initialize the token client after gapi is loaded
                        tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: GOOGLE_CLIENT_ID,
                            scope: SCOPES,
                            callback: '', // Will be set later
                            prompt: 'consent' // Force consent prompt
                        });
                        
                        gapiInited = true;
                        gisInited = true;
                        console.log('Google APIs initialized successfully');
                        resolve();
                    } catch (error) {
                        console.error('Error initializing Google API:', error);
                        reject(error);
                    }
                });
            });
        }

        async function authenticateGoogleCalendar() {
            if (!gapiInited || !gisInited) {
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait for initialization
                if (!gapiInited || !gisInited) {
                    throw new Error('Google APIs not initialized');
                }
            }

            if (!gapi.client.getToken()) {
                return new Promise((resolve, reject) => {
                    try {
                        tokenClient.callback = async (resp) => {
                            if (resp.error) {
                                reject(new Error('Access denied'));
                                return;
                            }
                            resolve(resp);
                        };
                        tokenClient.requestAccessToken({
                            prompt: 'consent'
                        });
                    } catch (error) {
                        reject(new Error('Failed to request access token'));
                    }
                });
            }
        }

        async function addToCalendar(medicineName, expiryDate) {
            try {
                // Check if Google API is loaded
                if (!gapi || !gapi.client) {
                    throw new Error('Google API not loaded');
                }

                // Check if user is authenticated with Google
                if (!gapi.client.getToken()) {
                    // Request calendar permission explicitly
                    await authenticateGoogleCalendar();
                }

                // Format expiry date for Google Calendar
                const eventDateTime = new Date(expiryDate);
                eventDateTime.setHours(9, 0, 0); // Set reminder for 9:00 AM

                // Create event one day before expiry
                const reminderDate = new Date(eventDateTime);
                reminderDate.setDate(reminderDate.getDate() - 1);

                // Format time in 12-hour format for event description
                const reminderTime = reminderDate.toLocaleString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });

                const event = {
                    summary: `Medicine Expiry Reminder: ${medicineName}`,
                    description: `Your medicine ${medicineName} will expire tomorrow at ${reminderTime}`,
                    start: {
                        dateTime: reminderDate.toISOString(),
                        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                    },
                    end: {
                        dateTime: new Date(reminderDate.getTime() + 30 * 60000).toISOString(),
                        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                    },
                    reminders: {
                        useDefault: false,
                        overrides: [
                            { method: 'popup', minutes: 24 * 60 },
                            { method: 'popup', minutes: 60 }
                        ]
                    }
                };

                // Insert the event
                const response = await gapi.client.calendar.events.insert({
                    calendarId: 'primary',
                    resource: event
                });

                console.log('Calendar event created:', response);
                return response;

            } catch (error) {
                console.error('Calendar error:', error);
                if (error.message.includes('permission') || error.status === 403) {
                    throw new Error('Please grant calendar access to add reminders');
                }
                throw error;
            }
        }

        async function handleMedicineSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;

            try {
                const { data: { user }, error: userError } = await supabase.auth.getUser();
                if (userError) throw userError;

                const formData = new FormData(form);
                const medicineData = {
                    name: formData.get('medicineName'),
                    type: formData.get('medicineType'),
                    expiry_date: formData.get('expiryDate'),
                    current_stock: parseInt(formData.get('currentStock')),
                    minimum_stock: parseInt(formData.get('minimumStock')),
                    notes: formData.get('notes'),
                    user_id: user.id
                };

                // First, save to Supabase
                const { data, error } = await supabase
                    .from('medicines')
                    .insert([medicineData])
                    .select();

                if (error) throw error;

                // Then, create Google Calendar event
                try {
                    await addToCalendar(medicineData.name, medicineData.expiry_date);
                    showNotification('Medicine added and expiry reminder set in Google Calendar', 'success');
                    // Close the modal using the existing function
                    closeMedicineModal();
                } catch (calendarError) {
                    console.error('Calendar error:', calendarError);
                    showNotification('Medicine added but failed to set calendar reminder', 'warning');
                }

                // Clear form and refresh medicines
                form.reset();
                loadMedicines();

            } catch (error) {
                console.error('Error:', error);
                showNotification(error.message || 'Failed to add medicine', 'error');
            } finally {
                submitButton.disabled = false;
            }
        }

        // Function to handle medicine deletion
        async function deleteMedicine(id) {
            if (!confirm('Are you sure you want to delete this medicine?')) return;

            try {
                // First get the medicine details for the reminder deletion
                const { data: medicine, error: fetchError } = await supabase
                    .from('medicines')
                    .select('name')
                    .eq('id', id)
                    .single();

                if (fetchError) throw fetchError;

                // Delete the medicine
                const { error } = await supabase
                    .from('medicines')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                // Delete associated reminders
                const { error: reminderError } = await supabase
                    .from('reminders')
                    .delete()
                    .or(`title.ilike.%${medicine.name}%,notes.ilike.%${medicine.name}%`);

                if (reminderError) {
                    console.error('Error deleting associated reminders:', reminderError);
                }

                showNotification('Medicine deleted successfully', 'success');
                await loadMedicines();

                // Update reminder counts in the calendar if it exists
                if (window.updateReminderCounts) {
                    window.updateReminderCounts();
                }
            } catch (error) {
                console.error('Error deleting medicine:', error);
                showNotification('Failed to delete medicine: ' + error.message, 'error');
            }
        }

        // Function to edit medicine
        async function editMedicine(id) {
            try {
                const { data: medicine, error } = await supabase
                    .from('medicines')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                document.getElementById('modalTitle').textContent = 'Edit Medicine';
                const form = document.getElementById('medicineForm');
                form.dataset.medicineId = id;
                form.medicineName.value = medicine.name;
                form.medicineType.value = medicine.type;
                form.expiryDate.value = medicine.expiry_date;
                form.currentStock.value = medicine.current_stock;
                form.minimumStock.value = medicine.minimum_stock;
                form.notes.value = medicine.notes || '';
                
                openMedicineModal(id);
            } catch (error) {
                console.error('Error loading medicine details:', error);
                showNotification('Failed to load medicine details', 'error');
            }
        }

        // Function to handle reorder
        async function reorderMedicine(id) {
            try {
                const { data: medicine, error } = await supabase
                    .from('medicines')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                const now = new Date();
                // Create a reorder reminder
                const reminderData = {
                    title: `Reorder Medicine: ${medicine.name}`,
                    type: 'reorder', // Match calendar's reminder type
                    date: now.toISOString().split('T')[0], // Store date only
                    time: now.toLocaleTimeString('en-US', { 
                        hour: 'numeric', 
                        minute: '2-digit',
                        hour12: true // Ensure 12-hour format as per memories
                    }),
                    notes: `Reorder request for ${medicine.name} (Current stock: ${medicine.current_stock}/${medicine.minimum_stock})`,
                    created_at: new Date().toISOString(),
                    status: 'pending', // Match calendar's reminder status
                    priority: 'high' // High priority for expiry reminders
                };

                const { error: reminderError } = await supabase
                    .from('reminders')
                    .insert([reminderData]);

                if (reminderError) throw reminderError;

                showNotification(`Reorder reminder created for ${medicine.name}`, 'success');

                // Update reminder counts in the calendar if it exists
                if (window.updateReminderCounts) {
                    window.updateReminderCounts();
                }
            } catch (error) {
                console.error('Error creating reorder request:', error);
                showNotification('Failed to create reorder request: ' + error.message, 'error');
            }
        }

        // Function to render medicines
        function renderMedicines(medicines) {
            const grid = document.getElementById('medicinesGrid');
            const noMedicines = document.getElementById('noMedicines');
            
            if (!medicines.length) {
                grid.style.display = 'none';
                noMedicines.style.display = 'flex';
                return;
            }

            grid.style.display = 'grid';
            noMedicines.style.display = 'none';
            grid.innerHTML = medicines.map(medicine => {
                const { formatted: expiryFormatted, daysUntilExpiry, expiryClass } = formatExpiryDate(medicine.expiry_date);
                const stockPercentage = (medicine.current_stock / medicine.minimum_stock) * 100;
                const stockClass = stockPercentage <= 25 ? 'low' : stockPercentage <= 50 ? 'medium' : 'high';
                const stockStatus = stockPercentage <= 25 ? 'Low Stock' : stockPercentage <= 50 ? 'Medium Stock' : 'Good Stock';

                return `
                    <div class="medicine-card ${stockPercentage <= 25 ? 'critical-stock' : ''}">
                        <div class="medicine-header">
                            <h3 class="medicine-name">${medicine.name}</h3>
                            <div class="medicine-actions">
                                <button onclick="editMedicine('${medicine.id}')" class="btn-icon edit" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteMedicine('${medicine.id}')" class="btn-icon delete" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="info-row">
                            <strong>Type:</strong> ${medicine.type.charAt(0).toUpperCase() + medicine.type.slice(1)}
                        </div>
                        <div class="info-row ${expiryClass}">
                            <strong>Expires:</strong> 
                            ${expiryClass === 'expired' 
                                ? `Expired (${Math.abs(daysUntilExpiry)} days ago)` 
                                : `${expiryFormatted} (${daysUntilExpiry} days left)`
                            }
                        </div>
                        <div class="info-row ${stockPercentage <= 25 ? 'low-stock' : ''}">
                            <strong>Stock:</strong>
                            <div class="stock-info">
                                <span>${medicine.current_stock} of ${medicine.minimum_stock} units (${stockStatus})</span>
                                <div class="stock-bar">
                                    <div class="stock-level ${stockClass}" style="width: ${Math.min(stockPercentage, 100)}%"></div>
                                </div>
                            </div>
                        </div>
                        ${medicine.notes ? `
                        <div class="info-row">
                            <strong>Notes:</strong> ${medicine.notes}
                        </div>
                        ` : ''}
                        ${stockPercentage <= 50 ? `
                        <div class="btn-reorder">
                            <button onclick="reorderMedicine('${medicine.id}')" title="Reorder Medicine">
                                <i class="fas fa-shopping-cart"></i> Reorder Medicine
                            </button>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Function to filter medicines
        function filterMedicines() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.toLowerCase().trim();

            // If search is empty, show all medicines
            if (!searchTerm) {
                renderMedicines(medicines);
                return;
            }

            // Filter medicines based on search term
            const filteredMedicines = medicines.filter(medicine => {
                const searchableText = [
                    medicine.name,
                    medicine.type,
                    medicine.notes,
                    formatDate(medicine.expiry_date)
                ].join(' ').toLowerCase();

                return searchableText.includes(searchTerm);
            });

            // Sort filtered medicines the same way as the main list
            filteredMedicines.sort((a, b) => {
                // First sort by expiry status
                const aExpiry = new Date(a.expiry_date);
                const bExpiry = new Date(b.expiry_date);
                const today = new Date();
                const aExpired = aExpiry < today;
                const bExpired = bExpiry < today;
                
                if (aExpired !== bExpired) {
                    return aExpired ? -1 : 1; // Show expired medicines first
                }

                // Then sort by stock status
                const aStockPercentage = (a.current_stock / a.minimum_stock) * 100;
                const bStockPercentage = (b.current_stock / b.minimum_stock) * 100;
                const aLowStock = aStockPercentage <= 25;
                const bLowStock = bStockPercentage <= 25;

                if (aLowStock !== bLowStock) {
                    return aLowStock ? -1 : 1; // Show low stock medicines next
                }

                // Finally sort by expiry date
                return aExpiry - bExpiry;
            });

            renderMedicines(filteredMedicines);

            // Show feedback about search results
            if (filteredMedicines.length === 0) {
                const grid = document.getElementById('medicinesGrid');
                grid.innerHTML = `
                    <div class="no-medicines">
                        <i class="fas fa-search"></i>
                        <p>No medicines found matching "${searchTerm}"</p>
                    </div>
                `;
            }
        }

        // Function to handle search box focus
        function handleSearchFocus(event) {
            const searchBox = event.target.closest('.search-box');
            if (event.type === 'focus') {
                searchBox.classList.add('focused');
            } else {
                searchBox.classList.remove('focused');
            }
        }

        // Function to open medicine modal
        function openMedicineModal(medicineId = null) {
            const modal = document.getElementById('medicineModal');
            const form = document.getElementById('medicineForm');
            const modalTitle = document.getElementById('modalTitle');

            // Add state to browser history when opening modal
            const state = { modal: 'medicine', medicineId };
            history.pushState(state, '', window.location.pathname);

            // Reset form
            form.reset();
            form.dataset.medicineId = medicineId || '';

            if (medicineId) {
                modalTitle.textContent = 'Edit Medicine';
                // Load medicine data
                const medicine = medicines.find(m => m.id === medicineId);
                if (medicine) {
                    form.medicineName.value = medicine.name;
                    form.medicineType.value = medicine.type;
                    form.expiryDate.value = medicine.expiry_date;
                    form.currentStock.value = medicine.current_stock;
                    form.minimumStock.value = medicine.minimum_stock;
                    form.notes.value = medicine.notes || '';
                }
            } else {
                modalTitle.textContent = 'Add New Medicine';
                // Set default expiry date to tomorrow
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                form.expiryDate.value = tomorrow.toISOString().split('T')[0];
                
                // Set default stock values
                form.currentStock.value = '0';
                form.minimumStock.value = '10';
            }

            // Show modal
            modal.classList.add('show');
            // Force reflow to ensure transition works
            modal.offsetHeight;
            modal.querySelector('.modal-content').style.transform = 'translateY(0)';

            // Add click outside to close
            const closeOnOutsideClick = (e) => {
                if (e.target === modal) {
                    closeMedicineModal();
                    modal.removeEventListener('click', closeOnOutsideClick);
                }
            };
            modal.addEventListener('click', closeOnOutsideClick);

            // Add escape key to close
            const closeOnEscape = (e) => {
                if (e.key === 'Escape') {
                    closeMedicineModal();
                    document.removeEventListener('keydown', closeOnEscape);
                }
            };
            document.addEventListener('keydown', closeOnEscape);
        }

        // Function to close medicine modal
        function closeMedicineModal() {
            const modal = document.getElementById('medicineModal');
            const modalContent = modal.querySelector('.modal-content');
            
            // Go back in history if we came from a modal state
            if (history.state && history.state.modal) {
                history.back();
            }
            
            // Animate out
            modalContent.style.transform = 'translateY(20px)';
            
            // Hide after animation
            setTimeout(() => {
                modal.classList.remove('show');
                modalContent.style.transform = '';
            }, 200);
        }

        // Handle browser back/forward
        window.addEventListener('popstate', (event) => {
            const modal = document.getElementById('medicineModal');
            
            // If we're going back and modal is open, close it
            if (modal.classList.contains('show')) {
                modal.querySelector('.modal-content').style.transform = 'translateY(20px)';
                setTimeout(() => {
                    modal.classList.remove('show');
                    modal.querySelector('.modal-content').style.transform = '';
                }, 200);
            }
            // If we're going forward to a modal state, open it
            else if (event.state && event.state.modal === 'medicine') {
                openMedicineModal(event.state.medicineId);
            }
        });

        // Add event listeners
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // Add form submit handler
            const medicineForm = document.getElementById('medicineForm');
            medicineForm.addEventListener('submit', handleMedicineSubmit);

            // Add search handlers
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', filterMedicines);
            searchInput.addEventListener('focus', handleSearchFocus);
            searchInput.addEventListener('blur', handleSearchFocus);

            // Load medicines
            await loadMedicines();

            // Set up real-time subscription for medicines
            supabase
                .channel('medicines_changes')
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'medicines',
                    filter: `user_id=eq.${user.id}`
                }, (payload) => {
                    // Only reload if the change was not made by this client
                    if (!payload.old || !payload.new || payload.old.updated_at !== payload.new.updated_at) {
                        loadMedicines();
                    }
                })
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'reminders',
                    filter: `user_id=eq.${user.id}`
                }, () => {
                    loadMedicines();
                })
                .subscribe();

            // Initialize date inputs with today's date as min
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('expiryDate').min = today;

            // Add keyboard shortcut for closing modal (Escape key)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeMedicineModal();
                }
            });

            // Initialize Google API
            initializeGoogleAPI();
        });

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);

        }
