<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DawaTrack - Email Confirmed</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --primary-color: #00b6db;
            --background-color: #161616;
            --text-color: #ffffff;
            --card-bg: #242424;
            --hover-color: #008db0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .confirmation-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .icon-container {
            margin-bottom: 1.5rem;
        }

        .icon-container i {
            font-size: 4rem;
            color: var(--primary-color);
            animation: scaleUp 0.5s ease;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        p {
            color: #ccc;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .login-btn {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 6px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .login-btn:hover {
            background-color: var(--hover-color);
        }

        @keyframes scaleUp {
            0% {
                transform: scale(0);
            }
            70% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="confirmation-container" id="confirmationContainer">
        <div class="icon-container">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
        <h1>Confirming Email...</h1>
        <p>Please wait while we verify your email address.</p>
    </div>

    <script>
        // Initialize Supabase client using shared configuration
        const supabase = window.supabase.createClient(
            window.SUPABASE_CONFIG.url,
            window.SUPABASE_CONFIG.anonKey
        );

        async function handleConfirmation() {
            const container = document.getElementById('confirmationContainer');
            try {
                // Get the token from URL hash
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const token = hashParams.get('token_hash') || hashParams.get('access_token');
                const type = hashParams.get('type');

                console.log('Confirmation params:', {
                    token: token ? 'present' : 'missing',
                    type
                });

                if (!token) {
                    throw new Error('No confirmation token found');
                }

                // Verify the email
                const { error } = await supabase.auth.verifyOtp({
                    token_hash: token,
                    type: 'signup'
                });

                if (error) {
                    throw error;
                }

                // Show success message
                container.innerHTML = `
                    <div class="icon-container">
                        <i class="fas fa-check-circle" style="color: #28a745;"></i>
                    </div>
                    <h1>Email Confirmed!</h1>
                    <p>Your email has been successfully verified. You can now log in to access your account.</p>
                    <a href="https://dawatrack.netlify.app/login.html" class="login-btn">Go to Login</a>
                `;

                // Clear the hash from URL
                history.replaceState(null, '', window.location.pathname);

            } catch (error) {
                console.error('Confirmation error:', error);
                container.innerHTML = `
                    <div class="icon-container">
                        <i class="fas fa-times-circle" style="color: #dc3545;"></i>
                    </div>
                    <h1>Confirmation Failed</h1>
                    <p>Error: ${error.message}</p>
                    <p>Please try again or contact support.</p>
                    <a href="https://dawatrack.netlify.app/login.html" class="login-btn">Return to Login</a>
                `;
            }
        }

        // Run confirmation when page loads
        document.addEventListener('DOMContentLoaded', handleConfirmation);
    </script>
</body>
</html>
